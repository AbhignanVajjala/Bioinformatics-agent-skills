name: offline-validation
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,examples]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/validate_skills.py
      - run: python scripts/build_catalog.py --check
      - run: pytest -q --junitxml=artifacts/pytest.xml
      - run: python examples/bulk-rnaseq/run.py --output artifacts/bulk-rnaseq
      - run: python examples/multiomics/run.py --output artifacts/multiomics
      - run: python examples/metabolic-modeling/run.py --output artifacts/metabolic-modeling
      - run: python scripts/run_evals.py --output artifacts/evals.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: artifacts/
