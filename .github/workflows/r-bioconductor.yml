name: r-bioconductor
on: [push, pull_request]
jobs:
  differential-expression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install pinned release prerequisites
        run: |
          Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/Archive/jsonlite/jsonlite_1.8.9.tar.gz", repos=NULL, type="source")'
          Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/Archive/BiocManager/BiocManager_1.30.25.tar.gz", repos=NULL, type="source")'
          Rscript recipes/rnaseq/install.R
      - run: Rscript recipes/rnaseq/test.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnaseq-execution-evidence
          path: |
            artifacts/rnaseq-ci/
            r-environment.txt
