name: r-bioconductor
on: [push, pull_request]
jobs:
  differential-expression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r44-bioc320-${{ runner.os }}-${{ hashFiles('recipes/rnaseq/environment.json') }}
      - name: Install pinned release prerequisites
        run: |
          Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/Archive/jsonlite/jsonlite_1.8.9.tar.gz", repos=NULL, type="source")'
          Rscript -e 'install.packages("https://cran.r-project.org/src/contrib/Archive/BiocManager/BiocManager_1.30.25.tar.gz", repos=NULL, type="source")'
          Rscript recipes/rnaseq/install.R
      - run: Rscript recipes/rnaseq/test.R
      - run: Rscript recipes/rnaseq/test-validation.R
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native R and Python identifier integration
        env:
          BIOSKILLS_NATIVE_R_TESTS: '1'
        run: |
          python -m pip install -e . scipy==1.15.3 pytest==8.3.5
          python -m pytest -q tests/test_domain_integration.py --junitxml=artifacts/domain-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnaseq-execution-evidence
          path: |
            artifacts/rnaseq-ci/
            artifacts/rnaseq-phase7/
            artifacts/domain-integration.xml
            r-environment.txt
